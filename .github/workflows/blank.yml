name: Ajax AI Monitor

on:
  workflow_dispatch:

jobs:
  fetch-ajax-news:
    runs-on: ubuntu-latest

    steps:
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests

      - name: Fetch VoetbalPrimeur Ajax news
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SECRET }}
        run: |
          python - <<'PY'
          import feedparser
          import requests
          import os

          feed_url = "https://www.voetbalprimeur.nl/feed/news.xml?tag=ajax"

          feed = feedparser.parse(feed_url)

          print(f"🔴⚪ Gevonden artikelen: {len(feed.entries)}")

          for entry in feed.entries[:10]:
              title = entry.get("title", "")
              url = entry.get("link", "")
              description = entry.get("summary", "")

              print("")
              print("📰", title)
              print("🔗", url)

              data = {
                  "source_id": 2,
                  "title": title,
                  "url": url,
                  "description": description
              }

              response = requests.post(
                  f"{os.environ['SUPABASE_URL']}/rest/v1/articles",
                  headers={
                      "apikey": os.environ["SUPABASE_KEY"],
                      "Authorization": f"Bearer {os.environ['SUPABASE_KEY']}",
                      "Content-Type": "application/json",
                      "Prefer": "resolution=ignore-duplicates"
                  },
                  json=data
              )

              print("Database:", response.status_code)
          PY
