name: Ajax AI Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  fetch-ajax-news:
    runs-on: ubuntu-latest

    steps:
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests

      - name: Check RSS sources and fetch news
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SECRET }}
        run: |
          python - <<'PY'
          import feedparser
          import requests
          import os
          from datetime import datetime, timezone

          SUPABASE_URL = os.environ["SUPABASE_URL"]
          SUPABASE_KEY = os.environ["SUPABASE_KEY"]

          HEADERS = {
              "apikey": SUPABASE_KEY,
              "Authorization": f"Bearer {SUPABASE_KEY}",
              "Content-Type": "application/json"
          }

          print("🔴⚪ AJAX AI MONITOR")
          print("")

          # Get all RSS sources
          response = requests.get(
              f"{SUPABASE_URL}/rest/v1/sources",
              headers=HEADERS,
              params={
                  "select": "id,name,feed_url,source_type",
                  "source_type": "eq.rss"
              }
          )

          if response.status_code != 200:
              print("❌ Sources ophalen mislukt:", response.status_code)
              print(response.text)
              raise SystemExit(1)

          sources = response.json()

          print(f"📡 RSS-bronnen gevonden: {len(sources)}")
          print("")

          total_new = 0
          working = 0
          broken = 0

          for source in sources:

              source_id = source["id"]
              source_name = source["name"]
              feed_url = source.get("feed_url")

              print("━━━━━━━━━━━━━━━━━━━━━━━━━━━━")
              print(f"🔎 {source_name}")

              if not feed_url:
                  print("🔴 GEEN FEED URL")
                  broken += 1
                  continue

              print(f"🔗 {feed_url}")

              try:
                  feed = feedparser.parse(feed_url)

                  article_count = len(feed.entries)

                  # Controleer of de feed daadwerkelijk bruikbaar is
                  if feed.bozo and article_count == 0:
                      print("🔴 FEED FOUT")
                      broken += 1
                      continue

                  if article_count == 0:
                      print("🟡 GEEN ARTIKELEN")
                  else:
                      print(f"🟢 FEED OK — {article_count} artikelen")
                      working += 1

              except Exception as error:
                  print(f"🔴 FOUT — {error}")
                  broken += 1
                  continue

              # Artikelen verwerken
              new_articles = 0
              existing_articles = 0

              for entry in feed.entries:

                  title = entry.get("title", "").strip()
                  url = entry.get("link", "").strip()
                  description = entry.get("summary", "").strip()

                  if not title or not url:
                      continue

                  # Check duplicate
                  check = requests.get(
                      f"{SUPABASE_URL}/rest/v1/articles",
                      headers=HEADERS,
                      params={
                          "select": "id",
                          "url": f"eq.{url}"
                      }
                  )

                  if check.status_code != 200:
                      print(
                          f"⚠️ Artikelcontrole mislukt: "
                          f"{check.status_code}"
                      )
                      continue

                  if check.json():
                      existing_articles += 1
                      continue

                  published_at = None

                  if (
                      hasattr(entry, "published_parsed")
                      and entry.published_parsed
                  ):
                      dt = datetime(
                          *entry.published_parsed[:6],
                          tzinfo=timezone.utc
                      )
                      published_at = dt.isoformat()

                  article = {
                      "source_id": source_id,
                      "title": title,
                      "url": url,
                      "description": description,
                      "published_at": published_at,
                      "category": "ajax"
                  }

                  insert = requests.post(
                      f"{SUPABASE_URL}/rest/v1/articles",
                      headers=HEADERS,
                      json=article
                  )

                  if insert.status_code in (200, 201):
                      new_articles += 1
                      total_new += 1
                  else:
                      print(
                          f"❌ Opslaan mislukt: "
                          f"{insert.status_code}"
                      )

              print(f"🆕 Nieuw: {new_articles}")
              print(f"⏭️ Al bekend: {existing_articles}")

          print("")
          print("━━━━━━━━━━━━━━━━━━━━━━━━━━━━")
          print("📊 BRONCONTROLE")
          print(f"🟢 Werkende feeds: {working}")
          print(f"🔴 Problemen: {broken}")
          print(f"📰 Nieuwe artikelen: {total_new}")
          print("━━━━━━━━━━━━━━━━━━━━━━━━━━━━")
          print("🔴⚪ Monitor klaar")
          PY
