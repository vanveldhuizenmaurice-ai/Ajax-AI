name: Ajax AI Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  fetch-ajax-news:
    runs-on: ubuntu-latest

    steps:
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests

      - name: Fetch all RSS sources
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SECRET }}
        run: |
          python - <<'PY'
          import feedparser
          import requests
          import os
          from datetime import datetime, timezone

          SUPABASE_URL = os.environ["SUPABASE_URL"]
          SUPABASE_KEY = os.environ["SUPABASE_KEY"]

          HEADERS = {
              "apikey": SUPABASE_KEY,
              "Authorization": f"Bearer {SUPABASE_KEY}",
              "Content-Type": "application/json"
          }

          print("🔴⚪ Ajax AI Monitor gestart")

          # Haal alle RSS-bronnen uit Supabase
          response = requests.get(
              f"{SUPABASE_URL}/rest/v1/sources",
              headers=HEADERS,
              params={
                  "select": "id,name,feed_url,source_type",
                  "source_type": "eq.rss"
              }
          )

          if response.status_code != 200:
              print("❌ Sources ophalen mislukt:", response.status_code)
              print(response.text)
              raise SystemExit(1)

          sources = response.json()

          print(f"📡 RSS-bronnen gevonden: {len(sources)}")

          total_new = 0

          for source in sources:

              source_id = source["id"]
              source_name = source["name"]
              feed_url = source["feed_url"]

              if not feed_url:
                  print(f"⚠️ {source_name}: geen feed URL, overgeslagen")
                  continue

              print("")
              print("━━━━━━━━━━━━━━━━━━━━")
              print(f"🔎 {source_name}")
              print(f"🔗 {feed_url}")
              print("━━━━━━━━━━━━━━━━━━━━")

              try:
                  feed = feedparser.parse(feed_url)
              except Exception as error:
                  print(f"❌ Feed-fout: {error}")
                  continue

              print(f"📰 Artikelen gevonden: {len(feed.entries)}")

              new_articles = 0
              existing_articles = 0

              for entry in feed.entries:

                  title = entry.get("title", "").strip()
                  url = entry.get("link", "").strip()
                  description = entry.get("summary", "").strip()

                  if not title or not url:
                      continue

                  # Controleer of artikel al bestaat
                  check = requests.get(
                      f"{SUPABASE_URL}/rest/v1/articles",
                      headers=HEADERS,
                      params={
                          "select": "id",
                          "url": f"eq.{url}"
                      }
                  )

                  if check.status_code != 200:
                      print("⚠️ Artikelcontrole mislukt:", check.status_code)
                      continue

                  if check.json():
                      existing_articles += 1
                      continue

                  published_at = None

                  if hasattr(entry, "published_parsed") and entry.published_parsed:
                      dt = datetime(
                          *entry.published_parsed[:6],
                          tzinfo=timezone.utc
                      )
                      published_at = dt.isoformat()

                  article = {
                      "source_id": source_id,
                      "title": title,
                      "url": url,
                      "description": description,
                      "published_at": published_at,
                      "category": "ajax"
                  }

                  insert = requests.post(
                      f"{SUPABASE_URL}/rest/v1/articles",
                      headers=HEADERS,
                      json=article
                  )

                  if insert.status_code in (200, 201):
                      new_articles += 1
                      total_new += 1
                      print("✅ Nieuw:", title)

                  else:
                      print(
                          f"❌ Opslaan mislukt ({insert.status_code}):",
                          insert.text
                      )

              print(f"🆕 Nieuw: {new_articles}")
              print(f"⏭️ Al bekend: {existing_articles}")

          print("")
          print("━━━━━━━━━━━━━━━━━━━━")
          print(f"📰 Totaal nieuwe artikelen: {total_new}")
          print("🔴⚪ Ajax AI Monitor klaar")
          print("━━━━━━━━━━━━━━━━━━━━")
          PY
