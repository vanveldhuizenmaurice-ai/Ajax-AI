name: Ajax AI Monitor

on:
  workflow_dispatch:

jobs:
  test-supabase:
    runs-on: ubuntu-latest

    steps:
      - name: Test Supabase connection
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          echo "🔴⚪ Ajax AI → Supabase test gestart"

          RESPONSE=$(curl -s \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            "$SUPABASE_URL/rest/v1/sources?select=id,name")

          echo "Supabase antwoord:"
          echo "$RESPONSE"
