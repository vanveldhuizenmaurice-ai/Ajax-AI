name: Ajax AI Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  fetch-ajax-news:
    runs-on: ubuntu-latest

    steps:
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests

      - name: Fetch Ajax news
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SECRET }}
        run: |
          python - <<'PY'
          import feedparser
          import requests
          import os
          from datetime import datetime, timezone

          SUPABASE_URL = os.environ["SUPABASE_URL"]
          SUPABASE_KEY = os.environ["SUPABASE_KEY"]

          HEADERS = {
              "apikey": SUPABASE_KEY,
              "Authorization": f"Bearer {SUPABASE_KEY}",
              "Content-Type": "application/json"
          }

          SOURCES = [
              {
                  "id": 2,
                  "name": "VoetbalPrimeur",
                  "feed": "https://www.voetbalprimeur.nl/feed/news.xml?tag=ajax"
              },
              {
                  "id": 3,
                  "name": "Voetbal International",
                  "feed": "https://www.vi.nl/feed/news.xml?tag=ajax"
              }
          ]

          total_new = 0

          print("🔴⚪ Ajax AI Monitor gestart")

          for source in SOURCES:

              print("")
              print("━━━━━━━━━━━━━━━━━━━━")
              print(f"🔎 {source['name']} controleren...")
              print("━━━━━━━━━━━━━━━━━━━━")

              feed = feedparser.parse(source["feed"])

              print(f"📰 {len(feed.entries)} artikelen gevonden")

              new_articles = 0
              existing_articles = 0

              for entry in feed.entries:

                  title = entry.get("title", "").strip()
                  url = entry.get("link", "").strip()
                  description = entry.get("summary", "").strip()

                  if not title or not url:
                      continue

                  check = requests.get(
                      f"{SUPABASE_URL}/rest/v1/articles",
                      headers=HEADERS,
                      params={
                          "select": "id",
                          "url": f"eq.{url}"
                      }
                  )

                  if check.status_code != 200:
                      print("⚠️ Controle mislukt:", check.status_code)
                      continue

                  if check.json():
                      existing_articles += 1
                      continue

                  published_at = None

                  if hasattr(entry, "published_parsed") and entry.published_parsed:
                      dt = datetime(
                          *entry.published_parsed[:6],
                          tzinfo=timezone.utc
                      )
                      published_at = dt.isoformat()

                  article = {
                      "source_id": source["id"],
                      "title": title,
                      "url": url,
                      "description": description,
                      "published_at": published_at,
                      "category": "ajax"
                  }

                  response = requests.post(
                      f"{SUPABASE_URL}/rest/v1/articles",
                      headers=HEADERS,
                      json=article
                  )

                  if response.status_code in (200, 201):
                      new_articles += 1
                      total_new += 1
                      print("✅ Nieuw:", title)
                  else:
                      print("❌ Opslaan mislukt:", response.status_code)
                      print(response.text)

              print(f"🆕 Nieuw van {source['name']}: {new_articles}")
              print(f"⏭️ Al bekend: {existing_articles}")

          print("")
          print("━━━━━━━━━━━━━━━━━━━━")
          print(f"📰 Totaal nieuwe artikelen: {total_new}")
          print("🔴⚪ Ajax AI Monitor klaar")
          print("━━━━━━━━━━━━━━━━━━━━")
          PY
