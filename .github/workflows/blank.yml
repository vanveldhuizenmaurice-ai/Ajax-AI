name: Ajax AI Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  fetch-ajax-news:
    runs-on: ubuntu-latest

    steps:
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests

      - name: Fetch VoetbalPrimeur Ajax news
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SECRET }}
        run: |
          python - <<'PY'
          import feedparser
          import requests
          import os
          from datetime import datetime, timezone

          FEED_URL = "https://www.voetbalprimeur.nl/feed/news.xml?tag=ajax"
          SOURCE_ID = 2

          supabase_url = os.environ["SUPABASE_URL"]
          supabase_key = os.environ["SUPABASE_KEY"]

          headers = {
              "apikey": supabase_key,
              "Authorization": f"Bearer {supabase_key}",
              "Content-Type": "application/json"
          }

          print("🔴⚪ Ajax AI Monitor gestart")
          print("🔎 VoetbalPrimeur controleren...")

          feed = feedparser.parse(FEED_URL)

          print(f"📰 {len(feed.entries)} artikelen gevonden")

          new_articles = 0
          skipped_articles = 0

          for entry in feed.entries:

              title = entry.get("title", "").strip()
              url = entry.get("link", "").strip()
              description = entry.get("summary", "").strip()

              if not title or not url:
                  continue

              # Controleer of artikel al bestaat
              check = requests.get(
                  f"{supabase_url}/rest/v1/articles",
                  headers=headers,
                  params={
                      "select": "id",
                      "url": f"eq.{url}"
                  }
              )

              if check.status_code != 200:
                  print("⚠️ Controle mislukt:", check.status_code)
                  continue

              if check.json():
                  skipped_articles += 1
                  continue

              # Publicatiedatum proberen te lezen
              published_at = None

              if hasattr(entry, "published_parsed") and entry.published_parsed:
                  dt = datetime(
                      *entry.published_parsed[:6],
                      tzinfo=timezone.utc
                  )
                  published_at = dt.isoformat()

              article = {
                  "source_id": SOURCE_ID,
                  "title": title,
                  "url": url,
                  "description": description,
                  "published_at": published_at,
                  "category": "ajax"
              }

              response = requests.post(
                  f"{supabase_url}/rest/v1/articles",
                  headers=headers,
                  json=article
              )

              if response.status_code in (200, 201):
                  new_articles += 1
                  print("✅ Nieuw:", title)
              else:
                  print("❌ Opslaan mislukt:", response.status_code)
                  print(response.text)

          print("")
          print("━━━━━━━━━━━━━━━━━━━━")
          print(f"🆕 Nieuwe artikelen: {new_articles}")
          print(f"⏭️ Al bekend: {skipped_articles}")
          print("━━━━━━━━━━━━━━━━━━━━")
          print("🔴⚪ Monitor klaar")
          PY
