name: Ajax AI Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  fetch-ajax-news:
    runs-on: ubuntu-latest

    steps:
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests

      - name: Fetch and filter Ajax news
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SECRET }}
        run: |
          python - <<'PY'
          import feedparser
          import requests
          import os
          import re
          from datetime import datetime, timezone

          SUPABASE_URL = os.environ["SUPABASE_URL"]
          SUPABASE_KEY = os.environ["SUPABASE_KEY"]

          HEADERS = {
              "apikey": SUPABASE_KEY,
              "Authorization": f"Bearer {SUPABASE_KEY}",
              "Content-Type": "application/json"
          }

          print("🔴⚪ AJAX AI MONITOR")
          print("🔎 Ajax-relevantie filter actief")
          print("")

          # Haal alle RSS-bronnen op
          response = requests.get(
              f"{SUPABASE_URL}/rest/v1/sources",
              headers=HEADERS,
              params={
                  "select": "id,name,feed_url,source_type",
                  "source_type": "eq.rss"
              }
          )

          if response.status_code != 200:
              print("❌ Sources ophalen mislukt:", response.status_code)
              print(response.text)
              raise SystemExit(1)

          sources = response.json()

          print(f"📡 RSS-bronnen gevonden: {len(sources)}")
          print("")

          total_new = 0
          filtered_out = 0

          # Woorden/termen die sterk op Ajax wijzen
          ajax_terms = [
              "ajax",
              "afc ajax",
              "ajax amsterdam",
              "jong ajax",
              "de godenzonen",
              "amsterdamse club",
              "amsterdamse ploeg",
              "amsterdammers",
              "johan cruijff arena",
              "cruijff arena"
          ]

          def is_ajax_article(title, description):
              text = f"{title} {description}".lower()

              # Normaliseer spaties
              text = re.sub(r"\s+", " ", text)

              for term in ajax_terms:
                  if term in text:
                      return True

              return False

          for source in sources:

              source_id = source["id"]
              source_name = source["name"]
              feed_url = source.get("feed_url")

              if not feed_url:
                  continue

              print("━━━━━━━━━━━━━━━━━━━━━━━━━━━━")
              print(f"🔎 {source_name}")

              try:
                  feed = feedparser.parse(feed_url)
              except Exception as error:
                  print(f"🔴 Feed-fout: {error}")
                  continue

              print(f"📰 Artikelen gevonden: {len(feed.entries)}")

              new_articles = 0
              filtered_articles = 0
              existing_articles = 0

              for entry in feed.entries:

                  title = entry.get("title", "").strip()
                  url = entry.get("link", "").strip()
                  description = entry.get("summary", "").strip()

                  if not title or not url:
                      continue

                  # AJAX FILTER
                  if not is_ajax_article(title, description):
                      filtered_articles += 1
                      filtered_out += 1
                      continue

                  # Controleer dubbele URL
                  check = requests.get(
                      f"{SUPABASE_URL}/rest/v1/articles",
                      headers=HEADERS,
                      params={
                          "select": "id",
                          "url": f"eq.{url}"
                      }
                  )

                  if check.status_code != 200:
                      print(
                          f"⚠️ Artikelcontrole mislukt: "
                          f"{check.status_code}"
                      )
                      continue

                  if check.json():
                      existing_articles += 1
                      continue

                  published_at = None

                  if (
                      hasattr(entry, "published_parsed")
                      and entry.published_parsed
                  ):
                      dt = datetime(
                          *entry.published_parsed[:6],
                          tzinfo=timezone.utc
                      )
                      published_at = dt.isoformat()

                  article = {
                      "source_id": source_id,
                      "title": title,
                      "url": url,
                      "description": description,
                      "published_at": published_at,
                      "category": "ajax",
                      "is_ajax": True
                  }

                  insert = requests.post(
                      f"{SUPABASE_URL}/rest/v1/articles",
                      headers=HEADERS,
                      json=article
                  )

                  if insert.status_code in (200, 201):
                      new_articles += 1
                      total_new += 1
                      print("🟢 AJAX:", title)

                  else:
                      print(
                          f"❌ Opslaan mislukt: "
                          f"{insert.status_code}"
                      )

              print(f"🆕 Nieuwe Ajax-artikelen: {new_articles}")
              print(f"⏭️ Al bekend: {existing_articles}")
              print(f"🚫 Niet Ajax: {filtered_articles}")

          print("")
          print("━━━━━━━━━━━━━━━━━━━━━━━━━━━━")
          print("📊 AJAX FILTER RESULTAAT")
          print(f"📰 Nieuwe Ajax-artikelen: {total_new}")
          print(f"🚫 Gefilterde artikelen: {filtered_out}")
          print("━━━━━━━━━━━━━━━━━━━━━━━━━━━━")
          print("🔴⚪ Monitor klaar")
          PY
